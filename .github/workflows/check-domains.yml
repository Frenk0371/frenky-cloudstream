name: Check source domains

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/domains.json'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/check-domains.yml'

permissions:
  contents: write

jobs:
  domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Probe redirects and apply strict auto-updates
        run: python tools/check_domains.py --apply
      - name: Save changes and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/domains.json reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: check source domains"
            git push
          fi
