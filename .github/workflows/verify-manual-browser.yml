name: Verify manual browser experiment

on:
  push:
    branches: [feature/manual-player-browser]
    paths:
      - 'MultiSource/**'
      - '.github/workflows/verify-manual-browser.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile extension (do not publish)
        run: gradle make makePluginsJson --no-daemon
